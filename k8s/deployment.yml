# Shadow AI - Kubernetes Deployment
apiVersion: v1
kind: Namespace
metadata:
  name: shadow-ai
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: shadow-config
  namespace: shadow-ai
data:
  LOG_LEVEL: "INFO"
  LLM_PROVIDER: "ollama_cloud"
  LLM_MODEL: "glm-5"
---
apiVersion: v1
kind: Secret
metadata:
  name: shadow-secrets
  namespace: shadow-ai
type: Opaque
stringData:
  DATABASE_URL: "postgresql://shadow:change-me-in-production@db:5432/shadow"
  REDIS_URL: "redis://cache:6379/0"
  LLM_API_KEY: "your_api_key_here"
  DB_PASSWORD: "change-me-in-production"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shadow-data
  namespace: shadow-ai
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-data
  namespace: shadow-ai
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shadow-api
  namespace: shadow-ai
spec:
  replicas: 3
  selector:
    matchLabels:
      app: shadow-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: shadow-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: shadow-api
        image: shadow-ai:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        envFrom:
        - configMapRef:
            name: shadow-config
        - secretRef:
            name: shadow-secrets
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: shadow-data
          mountPath: /app/data
        - name: shadow-logs
          mountPath: /app/logs
      volumes:
      - name: shadow-data
        persistentVolumeClaim:
          claimName: shadow-data
      - name: shadow-logs
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: shadow-api
  namespace: shadow-ai
spec:
  selector:
    app: shadow-api
  ports:
  - port: 80
    targetPort: 8000
    name: http
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: shadow-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: "shadow"
        - name: POSTGRES_USER
          value: "shadow"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: shadow-secrets
              key: DB_PASSWORD
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: db-data
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: db-data
        persistentVolumeClaim:
          claimName: db-data
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: shadow-ai
spec:
  selector:
    app: db
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache
  namespace: shadow-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cache
  template:
    metadata:
      labels:
        app: cache
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: cache
  namespace: shadow-ai
spec:
  selector:
    app: cache
  ports:
  - port: 6379
    targetPort: 6379
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shadow-ingress
  namespace: shadow-ai
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - api.shadow.local
    secretName: shadow-tls
  rules:
  - host: api.shadow.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: shadow-api
            port:
              number: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: shadow-api-hpa
  namespace: shadow-ai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: shadow-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80